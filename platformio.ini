[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Isrc
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
monitor_speed = 115200

; Fast iteration on one game: only its folder is compiled and the launcher lists only that game.
; Build with: pio run -e dev-throwhalla (build the default environment once first: this one reuses its libraries)
[env:dev-throwhalla]
extends = env:m5stack-sticks3
build_flags =
    ${env:m5stack-sticks3.build_flags}
    -DONLY_GAME_THROWHALLA
build_src_filter =
    +<*>
    -<games/bumperduel/>
    -<games/samuraiduel/>
    -<games/middiff/>
lib_deps =
lib_extra_dirs = .pio/libdeps/m5stack-sticks3

